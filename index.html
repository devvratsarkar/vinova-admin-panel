<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="keywords"
    content="admin dashboard template, react javascript, react js, react dashboard, react bootstrap, admin panel template, template dashboard, javascript, admin panel, admin dashboard, react admin panel template, react template, react admin, admin panel react template" />
  <title>VINOVA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    crossorigin="anonymous" id="bootstrapLink" />
  <style>
    #boot-loader {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      z-index: 9999;
    }
    #boot-loader .boot-spinner {
      width: 42px;
      height: 42px;
      border: 3px solid #e6e6e6;
      border-top-color: #111;
      border-radius: 50%;
      animation: boot-spin .7s linear infinite;
    }
    @keyframes boot-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>
  <div id="root">
    <div id="boot-loader" aria-busy="true" aria-label="Loading">
      <div class="boot-spinner"></div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
